[workspace]
members = [
    "crates/filepilot-app",
    "crates/filepilot-core",
    "crates/filepilot-cli",
    "apps/filepilot-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "2.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/andrewodom18/filepilot"

[profile.release]
lto = true
codegen-units = 1
strip = true
