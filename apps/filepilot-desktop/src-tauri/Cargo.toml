[package]
name = "filepilot-desktop"
version.workspace = true
description = "FilePilot desktop application"
authors = ["FilePilot contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "filepilot-desktop"

[lib]
name = "filepilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "filepilot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
csv = "1"
filepilot-app = { path = "../../../crates/filepilot-app" }
filepilot-core = { path = "../../../crates/filepilot-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
