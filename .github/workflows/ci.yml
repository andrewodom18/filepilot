name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/filepilot-desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/filepilot-desktop
        run: npm ci

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test desktop UI
        working-directory: apps/filepilot-desktop
        run: npm test

      - name: Build desktop UI
        working-directory: apps/filepilot-desktop
        run: npm run build

      - name: Build Tauri application
        working-directory: apps/filepilot-desktop
        run: npm run tauri:build -- --no-bundle
