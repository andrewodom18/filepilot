name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish assets for"
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      FILEPILOT_APPLE_ID: ${{ secrets.APPLE_ID }}
      FILEPILOT_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      FILEPILOT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      FILEPILOT_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      FILEPILOT_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      FILEPILOT_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            bundle: dmg
          - name: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
            bundle: dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bundle: nsis
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bundle: appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/filepilot-desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Import optional Apple signing certificate
        if: runner.os == 'macOS' && env.FILEPILOT_APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          echo "$FILEPILOT_APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$FILEPILOT_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$FILEPILOT_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$FILEPILOT_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$FILEPILOT_KEYCHAIN_PASSWORD" build.keychain

      - name: Select optional Apple signing identity
        if: runner.os == 'macOS' && env.FILEPILOT_APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          identity=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Set optional Apple notarization credentials
        if: runner.os == 'macOS' && env.FILEPILOT_APPLE_CERTIFICATE != '' && env.FILEPILOT_APPLE_ID != '' && env.FILEPILOT_APPLE_PASSWORD != '' && env.FILEPILOT_APPLE_TEAM_ID != ''
        shell: bash
        run: |
          echo "APPLE_ID=$FILEPILOT_APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$FILEPILOT_APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$FILEPILOT_APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install desktop dependencies
        working-directory: apps/filepilot-desktop
        run: npm ci

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p filepilot-cli

      - name: Build desktop bundles
        working-directory: apps/filepilot-desktop
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Package Unix artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/filepilot-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/filepilot release-assets/filepilot-${{ matrix.name }}/
          cp README.md release-assets/filepilot-${{ matrix.name }}/
          tar -czf release-assets/filepilot-${{ matrix.name }}.tar.gz -C release-assets filepilot-${{ matrix.name }}
          rm -rf release-assets/filepilot-${{ matrix.name }}
          mkdir -p release-assets
          if [ -d target/${{ matrix.target }}/release/bundle/dmg ]; then
            find target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -not -name 'rw.*' -exec cp {} release-assets/ \;
          fi
          if [ -d target/${{ matrix.target }}/release/bundle/appimage ]; then
            find target/${{ matrix.target }}/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -exec cp {} release-assets/ \;
          fi

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets/filepilot-${{ matrix.name }} | Out-Null
          Copy-Item target/${{ matrix.target }}/release/filepilot.exe release-assets/filepilot-${{ matrix.name }}/
          Copy-Item README.md release-assets/filepilot-${{ matrix.name }}/
          Compress-Archive -Path release-assets/filepilot-${{ matrix.name }} -DestinationPath release-assets/filepilot-${{ matrix.name }}.zip
          Remove-Item -Recurse -Force release-assets/filepilot-${{ matrix.name }}
          Get-ChildItem -Path target/${{ matrix.target }}/release/bundle -Recurse -Include *.exe,*.msi | Copy-Item -Destination release-assets

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: filepilot-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: filepilot-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum $(find . -type f -not -name SHA256SUMS.txt -printf '%p ') > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/**
