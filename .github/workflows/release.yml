name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p filepilot-cli

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/filepilot-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/filepilot dist/filepilot-${{ matrix.name }}/
          cp README.md dist/filepilot-${{ matrix.name }}/
          tar -czf filepilot-${{ matrix.name }}.tar.gz -C dist filepilot-${{ matrix.name }}

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/filepilot-${{ matrix.name }} | Out-Null
          Copy-Item target/${{ matrix.target }}/release/filepilot.exe dist/filepilot-${{ matrix.name }}/
          Copy-Item README.md dist/filepilot-${{ matrix.name }}/
          Compress-Archive -Path dist/filepilot-${{ matrix.name }} -DestinationPath filepilot-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: filepilot-${{ matrix.name }}
          path: filepilot-${{ matrix.name }}.*

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: filepilot-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

